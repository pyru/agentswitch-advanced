# Seat 33 (Red Team) v1 suite — harness entry point.
#
# The course runner reads only the agentswitch-harness.toml at the repository
# root (34-eval-harness/TASK_FORMAT.md). This file lives at the root of our fork
# and points the run command into 33-red-team/suite/, where the suite lives.
# (Instructor, 12 Nov 2026; same arrangement Seat 29 uses.)
#
# The suite itself (harness/, tasks/, tests/, bug-status.json) and its own copy
# of this file stay in 33-red-team/suite/. Keep the two in step.
install = "pip install -r 33-red-team/suite/requirements.txt"
run     = "cd 33-red-team/suite && python -m harness.runner --out results.json"
results = "33-red-team/suite/results.json"
instances = ["suryodaya", "keystone"]
timeout_minutes = 10
